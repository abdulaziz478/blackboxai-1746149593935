<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Rolling Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
    .dice {
      width: 80px;
      height: 80px;
      margin: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      font-size: 2rem;
      cursor: pointer;
      user-select: none;
      animation: spin 3s linear infinite;
      perspective: 1000px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
    }
    .dice:hover {
      transform: scale(1.1);
      animation-play-state: paused;
    }
    @keyframes spin {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(360deg); }
    }
    /* Polygon shapes using clip-path */
    .shape-triangle {
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    }
    .shape-square {
      clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    }
    .shape-pentagon {
      clip-path: polygon(50% 0%, 90% 35%, 75% 90%, 25% 90%, 10% 35%);
    }
    .shape-hexagon {
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-4xl font-bold mb-6 text-gray-800">Dice Rolling Game</h1>
  <div class="mb-4 flex space-x-4">
    <button id="add-triangle" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded shadow">
      Add Triangle Dice
    </button>
    <button id="add-square" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded shadow">
      Add Square Dice
    </button>
    <button id="add-pentagon" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow">
      Add Pentagon Dice
    </button>
    <button id="add-hexagon" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded shadow">
      Add Hexagon Dice
    </button>
  </div>
  <div id="dice-container" class="bg-white rounded-lg shadow-lg p-6 w-full max-w-4xl min-h-[300px] flex flex-wrap justify-center items-center">
    <!-- Dice will be added here -->
  </div>

  <script>
    const diceContainer = document.getElementById('dice-container');

    // Colors for dice
    const colors = ['#EF4444', '#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EC4899'];

    // Function to create a dice element
    function createDice(shapeClass) {
      const dice = document.createElement('div');
      dice.classList.add('dice', shapeClass);
      dice.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      dice.textContent = Math.floor(Math.random() * 6) + 1; // Dice face number 1-6

      // On click, roll the dice (change number and color)
      dice.addEventListener('click', () => {
        dice.textContent = Math.floor(Math.random() * 6) + 1;
        dice.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      });

      return dice;
    }

    // Add event listeners to buttons
    document.getElementById('add-triangle').addEventListener('click', () => {
      diceContainer.appendChild(createDice('shape-triangle'));
    });
    document.getElementById('add-square').addEventListener('click', () => {
      diceContainer.appendChild(createDice('shape-square'));
    });
    document.getElementById('add-pentagon').addEventListener('click', () => {
      diceContainer.appendChild(createDice('shape-pentagon'));
    });
    document.getElementById('add-hexagon').addEventListener('click', () => {
      diceContainer.appendChild(createDice('shape-hexagon'));
    });
  </script>
</body>
</html>
